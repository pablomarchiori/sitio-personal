{{ if and .IsPage (in (slice "notas" "labs" "escritos") .Section) }}

<div class="mn-share">

  <button type="button" id="mn-share-facebook">
    Facebook
  </button>

  <button type="button" id="mn-share-native">
    Compartir
  </button>

  <button type="button" id="mn-copy-url">
    Copiar enlace
  </button>

  <span id="mn-copy-ok" hidden>Copiado ✓</span>

  <span class="mn-share-separator">·</span>

  <button
    id="appearance-switcher-share"
    type="button"
    class="mn-appearance"
    aria-label="Cambiar apariencia"
  >
    <span class="dark:hidden" title="Modo oscuro">
      {{ partial "icon.html" "moon" }}
    </span>

    <span class="hidden dark:inline" title="Modo claro">
      {{ partial "icon.html" "sun" }}
    </span>
  </button>

</div>

<style>
  .mn-share {
    margin: 2.2rem 0 1.8rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(128, 128, 128, 0.3);

    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-start;
    gap: 0.85rem;

    font-size: 0.9rem;
  }

  .mn-share button {
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .mn-share-separator {
    opacity: 0.45;
  }

  .mn-appearance {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.2rem;
    height: 1.2rem;
    text-decoration: none !important;
  }

  .mn-appearance svg {
    width: 1rem;
    height: 1rem;
  }

  #mn-copy-ok {
    opacity: 0.65;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

  /*
   * Mueve el bloque desde el footer hasta debajo
   * del encabezado de la nota.
   */
  const shareBlock = document.querySelector(".mn-share");
  const articleHeader = document.querySelector("main article > header");

  if (shareBlock && articleHeader) {
    articleHeader.insertAdjacentElement("afterend", shareBlock);
  }

  const url = window.location.href;
  const title = document.title;

  const facebook = document.getElementById("mn-share-facebook");
  const compartir = document.getElementById("mn-share-native");
  const copiar = document.getElementById("mn-copy-url");
  const copiado = document.getElementById("mn-copy-ok");
  const path = window.location.pathname;
const today = new Date().toISOString().slice(0, 10);
const viewKey = "mn-view-" + path + "-" + today;

function crearContadorLecturas() {
  const header = document.querySelector("main article > header");
  if (!header) return null;

  const elements = header.querySelectorAll("*");
  let metadata = null;

  for (const el of elements) {
    const text = el.textContent.trim();

    if (
      (text.includes(" min") || text.includes(" mins")) &&
      !Array.from(el.children).some(child =>
        child.textContent.includes(" min") ||
        child.textContent.includes(" mins")
      )
    ) {
      metadata = el;
      break;
    }
  }

  if (!metadata) return null;

  const span = document.createElement("span");
  span.id = "mn-view-count";
  span.textContent = " · — lecturas";

  metadata.appendChild(span);

  return span;
}

async function cargarLecturas() {
  const contador = crearContadorLecturas();

  if (!contador) return;

  /*
   * En localhost mostramos el lugar del contador,
   * pero no consultamos Cloudflare.
   */
  if (
    window.location.hostname === "localhost" ||
    window.location.hostname === "127.0.0.1"
  ) {
    return;
  }

  try {
    const yaContada = localStorage.getItem(viewKey);
    const method = yaContada ? "GET" : "POST";

    const response = await fetch(
      "/api/views?path=" + encodeURIComponent(path),
      { method: method }
    );

    if (!response.ok) return;

    const data = await response.json();
    const views = Number(data.views || 0);

    contador.textContent =
      " · " +
      views +
      (views === 1 ? " lectura" : " lecturas");

    /*
     * Marcamos la lectura recién después
     * de que Cloudflare respondió correctamente.
     */
    if (method === "POST") {
      localStorage.setItem(viewKey, "1");
    }

  } catch (e) {
    // Dejamos "— lecturas" si el contador no está disponible.
  }
}

cargarLecturas();


  /*
   * Facebook
   */
  if (facebook) {
    facebook.addEventListener("click", function () {
      const shareUrl =
        "https://www.facebook.com/sharer/sharer.php?u=" +
        encodeURIComponent(url);

      window.open(
        shareUrl,
        "facebook-share",
        "width=700,height=500"
      );
    });
  }

  /*
   * Compartir mediante el menú nativo del dispositivo.
   */
  if (compartir) {
    if (!navigator.share) {
      compartir.hidden = true;
    } else {
      compartir.addEventListener("click", async function () {
        try {
          await navigator.share({
            title: title,
            url: url
          });
        } catch (e) {
          /*
           * Si el usuario cancela, no hacemos nada.
           */
        }
      });
    }
  }

  /*
   * Copiar URL
   */
  if (copiar) {
    copiar.addEventListener("click", copiarURL);
  }

  async function copiarURL() {
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      const temp = document.createElement("textarea");
      temp.value = url;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      temp.remove();
    }

    if (copiado) {
      copiado.hidden = false;

      setTimeout(function () {
        copiado.hidden = true;
      }, 2000);
    }
  }

});
</script>

{{ end }}
