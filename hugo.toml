baseURL = "https://www.marchiori.ar/"
locale = "es-ar"
title = "Mirada Nerd"
theme = "congo"

defaultContentLanguage = "es"
disableLanguages = ["en"]
enableRobotsTXT = true
summaryLength = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[pagination]
  pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  subtitle = "Apuntes técnicos con mirada propia"
  description = "Notas sobre tecnología, infraestructura, seguridad web y demases."
  mainSections = ["notas", "labs", "site-log"]
  enableSearch = true

[params.homepage]
  layout = "page"
  showRecent = true
  recentLimit = 6

[params.author]
  name = "Pablo Marchiori"
  image = "img/author.jpg"
  headline = "Notas personales sobre lenguaje, IT, trabajo y organización"
  bio = "Infraestructura IT. Apuntes, ensayos y notas técnicas."
  
[caches]
[caches.images]
dir = ':cacheDir/images'

[[menus.main]]
name = "Notas"
pageRef = "notas"
weight = 10

[[menus.main]]
name = "Labs"
pageRef = "labs"
weight = 20

[[menus.main]]
name = "Escritos"
url = "/escritos/"
weight = 30

[[menus.main]]
name = "Lenguaje"
pageRef = "manual-de-supervivencia-linguistica"
weight = 40

[[menus.main]]
name = "Site Log"
pageRef = "site-log"
weight = 50

[[menus.main]]
identifier = "search"
weight = 60

[menus.main.params]
action = "search"
icon = "search"

[[menus.main]]
name = "Acerca de"
pageRef = "/about"
weight = 99